        - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 上传文件
                tag_ids:
                  type: string
                  description: 逗号分隔的媒体标签 ID
      responses:
        "201":
          description: 文件已上传
          content:
            application/json:
              schema:
                type: object
                properties:
                  media:
                    $ref: '#/components/schemas/Media'

  /admin/media:
    get:
      tags: [管理后台/媒体]
      summary: 媒体库列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: tag
          in: query
          schema:
            type: string
            format: uuid
          description: 按媒体标签 ID 筛选
        - name: search
          in: query
          schema:
            type: string
          description: 搜索文件名
      responses:
        "200":
          description: 媒体列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pagination'

  /admin/media/{id}:
    delete:
      tags: [管理后台/媒体]
