openapi: "3.0.3"
info:
  title: Tano Blog API
  description: |
    个人博客后端 API 接口，提供文章管理、评论系统、媒体管理、站点配置等功能。
    所有 API 以 `/api/v1` 为前缀。
  version: "1.0.0"
  contact:
    name: Tano
    url: https://tano.asia

servers:
  - url: /api/v1
    description: API v1 基础路径

security: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 在 Authorization 头部使用 Bearer 令牌
    CookieAuth:
      type: apiKey
      in: cookie
      name: jwt
      description: 通过 jwt Cookie 传递令牌
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF 令牌，对非 GET/HEAD/OPTIONS 请求需要

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: 错误描述
      required:
        - error

    Pagination:
      type: object
      properties:
        items:
          type: array
        total:
          type: integer
          description: 总数
        page:
          type: integer
          description: 当前页码
        size:
          type: integer
          description: 每页数量

    UserInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        avatar_url:
          type: string
        role:
          type: string
        must_change_password:
          type: boolean

    TokenResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'

    PostReactions:
      type: object
      additionalProperties:
        type: integer

    TOTPRequiredResponse:
      type: object
      properties:
        totp_required:
          type: boolean
          enum: [true]
        user_id:
          type: string
          format: uuid

    WebAuthnOptions:
      type: object
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
        allowCredentials:
          type: array
          items:
            type: object
        userVerification:
          type: string
        attestation:
          type: string

    PublicConfig:
      type: object
      properties:
        site_title:
          type: string
        site_description:
          type: string
        site_url:
          type: string
        favicon:
          type: string
        posts_per_page:
          type: integer
        excerpt_length:
          type: integer
        comments_enabled:
          type: boolean
        default_theme:
          type: string
        accent_hue:
          type: integer
        music_page_config:
          type: string
          description: 音乐馆配置 JSON 字符串

    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
        cover_image:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        is_top:
          type: boolean
        allow_comment:
          type: boolean
        view_count:
          type: integer
        category_id:
          type: integer
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reactions:
          $ref: '#/components/schemas/PostReactions'
        password_hint:
          type: string

    PostPublic:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        content:
          type: string
        excerpt:
          type: string
        cover_image:
          type: string
        is_top:
          type: boolean
        allow_comment:
          type: boolean
        view_count:
          type: integer
        category:
          $ref: '#/components/schemas/Category'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        series:
          type: array
          items:
            $ref: '#/components/schemas/Series'
        published_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        reactions:
          $ref: '#/components/schemas/PostReactions'

    PostSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        cover_image:
          type: string
        status:
          type: string
        is_top:
          type: boolean
        view_count:
          type: integer
        comment_count:
          type: integer
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        post_count:
          type: integer

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        post_count:
          type: integer

    Comment:
      type: object
      properties:
        id:
          type: integer
        post_id:
          type: integer
        parent_id:
          type: integer
          nullable: true
        nickname:
          type: string
        email:
          type: string
        website:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, spam]
        ip_address:
          type: string
        is_spam:
          type: boolean
        user_agent:
          type: string
        fingerprint:
          type: string
        country:
          type: string
        city:
          type: string
        edited_count:
          type: integer
        edited_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        reactions:
          $ref: '#/components/schemas/PostReactions'
        children:
          type: array
          items:
            $ref: '#/components/schemas/Comment'

    Series:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        cover_image:
          type: string
        post_count:
          type: integer
        sort_order:
          type: integer

    Media:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        original_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        url:
          type: string
        thumbnail_url:
          type: string
          nullable: true
        alt_text:
          type: string
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string

    FriendLink:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        description:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        email:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time

    NavLink:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        url:
          type: string
        sort_order:
          type: integer

    Notification:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        content:
          type: string
        link:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    Backup:
      type: object
      properties:
        filename:
          type: string
        size:
          type: integer
        created_at:
          type: string
          format: date-time

    AccessLog:
      type: object
      properties:
        id:
          type: integer
        ip_address:
          type: string
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        response_time:
          type: number
        referer:
          type: string
        user_agent:
          type: string
        country:
          type: string
        city:
          type: string
        device_type:
          type: string
        browser:
          type: string
        os:
          type: string
        created_at:
          type: string
          format: date-time

    WebAuthnCredential:
      type: object
      properties:
        id:
          type: string
        nickname:
          type: string
        created_at:
          type: string
          format: date-time

    CommenterBlock:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        reason:
          type: string
        created_at:
          type: string
          format: date-time

paths:
  # ─── Health ───
  /health:
    get:
      operationId: healthCheck
      summary: 健康检查
      tags: [系统]
      responses:
        "200":
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string

  # ─── RSS / Sitemap ───
  /rss.xml:
    get:
      operationId: getRSS
      summary: RSS Feed
      tags: [Feed]
      responses:
        "200":
          description: RSS XML
          content:
            application/rss+xml:
              schema:
                type: string

  /sitemap.xml:
    get:
      operationId: getSitemap
      summary: Sitemap
      tags: [Feed]
      responses:
        "200":
          description: Sitemap XML
          content:
            application/xml:
              schema:
                type: string

  # ─── Auth ───
  /auth/login:
    post:
      operationId: login
      summary: 用户登录
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                remember_me:
                  type: boolean
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/TOTPRequiredResponse'
        "401":
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login/totp:
    post:
      operationId: loginWithTOTP
      summary: TOTP 两步验证登录
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, totp_code]
              properties:
                user_id:
                  type: string
                  format: uuid
                totp_code:
                  type: string
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/me:
    get:
      operationId: getMe
      summary: 获取当前用户信息
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: 退出成功

  /auth/profile:
    put:
      operationId: updateProfile
      summary: 更新个人资料
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                email:
                  type: string
                avatar_url:
                  type: string
                bio:
                  type: string
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  /auth/password:
    put:
      operationId: changePassword
      summary: 修改密码
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: 修改成功

  /auth/totp/setup:
    post:
      operationId: totpSetup
      summary: TOTP 设置（获取密钥和二维码）
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: TOTP 设置信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qr_code:
                    type: string
                  uri:
                    type: string

  /auth/totp/verify:
    post:
      operationId: totpVerify
      summary: 验证并启用 TOTP
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
      responses:
        "200":
          description: TOTP 已启用

  /auth/totp:
    delete:
      operationId: totpDisable
      summary: 禁用 TOTP
      tags: [认证]
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: TOTP 已禁用

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: 忘记密码（发送重置邮件）
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "200":
          description: 重置邮件已发送

  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: 重置密码
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        "200":
          description: 密码重置成功

  /auth/passkey/login/options:
    post:
      operationId: passkeyLoginOptions
      summary: Passkey 登录 — 获取认证选项
      tags: [WebAuthn]
      responses:
        "200":
          description: WebAuthn 认证选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'

  /auth/passkey/login/verify:
    post:
      operationId: passkeyLoginVerify
      summary: Passkey 登录 — 验证认证结果
      tags: [WebAuthn]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/passkey/register/options:
    post:
      operationId: passkeyRegisterOptions
      summary: Passkey 注册 — 获取创建选项
      tags: [WebAuthn]
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: WebAuthn 创建选项
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAuthnOptions'

  /auth/passkey/register/verify:
    post:
      operationId: passkeyRegisterVerify
      summary: Passkey 注册 — 验证创建结果
      tags: [WebAuthn]
      security:
        - CookieAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: 注册成功

  /auth/passkeys:
    get:
      operationId: listPasskeys
      summary: 列出已注册的 Passkey
      tags: [WebAuthn]
      security:
        - CookieAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Passkey 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebAuthnCredential'

  /auth/passkey/{id}:
    delete:
      operationId: deletePasskey
      summary: 删除 Passkey
      tags: [WebAuthn]
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功

  /auth/passkey/{id}/rename:
    put:
      operationId: renamePasskey
      summary: 重命名 Passkey
      tags: [WebAuthn]
      security:
        - CookieAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: string
      responses:
        "200":
          description: 重命名成功

  # ─── Posts (Public) ───
  /posts:
    get:
      operationId: listPosts
      summary: 文章列表（公开）
      tags: [文章]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: series
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 文章列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
                  total:
                    type: integer
                  page:
                    type: integer
                  size:
                    type: integer

  /posts/top:
    get:
      operationId: getTopPosts
      summary: 置顶文章
      tags: [文章]
      responses:
        "200":
          description: 置顶文章列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSummary'

  /posts/top-viewed:
    get:
      operationId: getTopViewedPosts
      summary: 热门文章
      tags: [文章]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: 热门文章列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSummary'

  /posts/{slug}:
    get:
      operationId: getPostBySlug
      summary: 文章详情
      tags: [文章]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文章详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPublic'
        "404":
          description: 文章不存在

  /posts/{slug}/adjacent:
    get:
      operationId: getAdjacentPosts
      summary: 上一篇/下一篇
      tags: [文章]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 相邻文章
          content:
            application/json:
              schema:
                type: object
                properties:
                  prev:
                    type: object
                    properties:
                      title:
                        type: string
                      slug:
                        type: string
                  next:
                    type: object
                    properties:
                      title:
                        type: string
                      slug:
                        type: string

  /posts/{slug}/related:
    get:
      operationId: getRelatedPosts
      summary: 猜你喜欢（相关文章推荐）
      tags: [文章]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
      responses:
        "200":
          description: 推荐文章列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostSummary'

  /posts/{slug}/reactions:
    post:
      operationId: togglePostReaction
      summary: 切换文章表情反应
      tags: [文章]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji:
                  type: string
      responses:
        "200":
          description: 更新后的反应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostReactions'

  /posts/{slug}/verify-password:
    post:
      operationId: verifyPostPassword
      summary: 验证文章密码
      tags: [文章]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: 验证通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean

  /posts/preview:
    get:
      operationId: getPostByPreviewToken
      summary: 通过预览令牌查看文章
      tags: [文章]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 文章内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPublic'

  /posts/calendar:
    get:
      operationId: getCalendarPosts
