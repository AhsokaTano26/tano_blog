        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已删除

  # ========================================
  # Admin - Series
  # ========================================
  /admin/series:
    get:
      tags: [管理后台/系列]
      summary: 后台系列列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: 系列列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Series'

    post:
      tags: [管理后台/系列]
      summary: 创建系列
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                cover_image:
                  type: string
                sort_order:
                  type: integer
                  default: 0
      responses:
        "201":
          description: 系列已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    $ref: '#/components/schemas/Series'

  /admin/series/{id}:
    put:
      tags: [管理后台/系列]
      summary: 更新系列
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                cover_image:
                  type: string
                sort_order:
                  type: integer
      responses:
        "200":
          description: 已更新

    delete:
      tags: [管理后台/系列]
      summary: 删除系列
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已删除

  /admin/series/{id}/posts:
    get:
      tags: [管理后台/系列]
      summary: 获取系列中的文章列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 文章列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostItem'

    put:
      tags: [管理后台/系列]
      summary: 批量设置系列文章
      description: 替换系列中的全部现有文章。
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post_ids]
              properties:
                post_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: 已更新

  # ========================================
  # Admin - Site Config
  # ========================================
  /admin/config:
    get:
      tags: [管理后台/站点配置]
      summary: 获取全部站点配置
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: 全部配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteConfig'

    put:
      tags: [管理后台/站点配置]
      summary: 更新站点配置
      description: 仅更新请求中包含的配置项。
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: 配置已更新

  /admin/config/test-email:
    post:
      tags: [管理后台/站点配置]
      summary: 发送测试邮件
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  format: email
      responses:
        "200":
          description: 测试邮件已发送

  # ========================================
  # Admin - Users
  # ========================================
  /admin/users:
    get:
      tags: [管理后台/用户]
      summary: 获取所有用户列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserInfo'

  # ========================================
  # Admin - Access Logs
  # ========================================
  /admin/access-logs:
    get:
      tags: [管理后台/访问日志]
      summary: 访问日志列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: path
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: ip
          in: query
          schema:
            type: string
        - name: status_code
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 日志列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AccessLog'

  /admin/access-logs/stats:
    get:
      tags: [管理后台/访问日志]
      summary: 获取访问统计
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: 访问统计
          content:
            application/json:
              schema:
                type: object

  /admin/access-logs/export:
    get:
      tags: [管理后台/访问日志]
      summary: 导出访问日志为 CSV
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: path
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: ip
          in: query
          schema:
            type: string
        - name: status_code
          in: query
          schema:
            type: string
        - name: start
          in: query
          schema:
            type: string
        - name: end
          in: query
          schema:
            type: string
      responses:
        "200":
          description: CSV 文件下载
          headers:
            Content-Type:
              schema:
                type: string
                example: text/csv; charset=utf-8

  /admin/access-logs/{id}:
    delete:
      tags: [管理后台/访问日志]
      summary: 删除单条访问日志
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已删除

  /admin/access-logs/clear:
    post:
      tags: [管理后台/访问日志]
      summary: 清空全部访问日志
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  enum: [CLEAR_ALL]
      responses:
        "200":
          description: 已清空

  # ========================================
  # Admin - Backup & Restore
  # ========================================
  /admin/backups:
    get:
      tags: [管理后台/备份恢复]
      summary: 列出备份文件
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "200":
          description: 备份文件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BackupFile'

    post:
      tags: [管理后台/备份恢复]
      summary: 创建备份
      description: 导出数据库全部表数据和上传文件，打包为 ZIP。
      security:
        - BearerAuth: []
        - CookieAuth: []
      responses:
        "201":
          description: 备份已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  filename:
                    type: string

  /admin/backups/{filename}/download:
    get:
      tags: [管理后台/备份恢复]
      summary: 下载备份文件
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: 备份文件名（不可包含 / 或 ..）
      responses:
        "200":
          description: ZIP 文件下载
          headers:
            Content-Type:
              schema:
                type: string
                example: application/zip

  /admin/backups/{filename}:
    delete:
      tags: [管理后台/备份恢复]
      summary: 删除备份文件
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已删除

  /admin/restore/upload:
    post:
      tags: [管理后台/备份恢复]
      summary: 上传 ZIP 备份并恢复
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP 备份文件（最大 500MB）
      responses:
        "200":
          description: 恢复完成
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 恢复完成
                  warning:
                    type: string
                    description: 部分文件恢复失败时的警告信息

  /admin/restore/url:
    post:
      tags: [管理后台/备份恢复]
      summary: 从 URL 下载备份并恢复
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: 恢复完成

  /admin/restore/local:
    post:
      tags: [管理后台/备份恢复]
      summary: 从本地备份文件恢复
      security:
        - BearerAuth: []
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename:
                  type: string
                  description: 备份文件名（不可包含 / 或 ..）
      responses:
        "200":
          description: 恢复完成
