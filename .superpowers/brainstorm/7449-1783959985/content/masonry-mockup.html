<h2>方案 C：瀑布流 / 混合网格</h2>
<p class="subtitle">图片保持原始比例，大小不一，自然错落排列 — 类似 Pinterest / 500px</p>

<div class="mockup">
  <div class="mockup-header">
    <div style="display:flex;align-items:center;gap:12px;padding:0 16px;">
      <span style="font-weight:600;">📷 图片馆</span>
      <span style="color:var(--muted);font-size:13px;margin-left:auto;">共 24 张</span>
    </div>
  </div>
  <div class="mockup-body" style="padding:24px;">
    <!-- 瀑布流 -- 左窄右宽，不等高排列 -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;grid-template-rows:masonry;">
      <!-- 左列：高 -->
      <div style="grid-column:1;">
        <div style="background:#2d2d3d;border-radius:8px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div style="height:180px;background:linear-gradient(135deg,#6c5ce7,#a29bfe);display:flex;align-items:center;justify-content:center;font-size:40px;">🏔️</div>
          <div style="padding:8px;font-size:11px;color:var(--text-secondary);">雪山 · 2024</div>
        </div>
        <div style="background:#2d2d3d;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div style="height:100px;background:linear-gradient(135deg,#00b894,#00cec9);display:flex;align-items:center;justify-content:center;font-size:32px;">🌿</div>
          <div style="padding:8px;font-size:11px;color:var(--text-secondary);">森林</div>
        </div>
      </div>
      <!-- 中列：窄高 -->
      <div style="grid-column:2;">
        <div style="background:#2d2d3d;border-radius:8px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div style="height:140px;background:linear-gradient(135deg,#fd79a8,#e84393);display:flex;align-items:center;justify-content:center;font-size:40px;">🌊</div>
          <div style="padding:8px;font-size:11px;color:var(--text-secondary);">海岸线</div>
        </div>
        <div style="background:#2d2d3d;border-radius:8px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div style="height:160px;background:linear-gradient(135deg,#fdcb6e,#e17055);display:flex;align-items:center;justify-content:center;font-size:32px;">🌅</div>
          <div style="padding:8px;font-size:11px;color:var(--text-secondary);">日落大道</div>
        </div>
      </div>
      <!-- 右列：宽高混合 -->
      <div style="grid-column:3;">
        <div style="background:#2d2d3d;border-radius:8px;margin-bottom:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div style="height:120px;background:linear-gradient(135deg,#e17055,#d63031);display:flex;align-items:center;justify-content:center;font-size:36px;">🌸</div>
          <div style="padding:8px;font-size:11px;color:var(--text-secondary);">花</div>
        </div>
        <div style="background:#2d2d3d;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div style="height:200px;background:linear-gradient(135deg,#6c5ce7,#fd79a8);display:flex;align-items:center;justify-content:center;font-size:40px;">🌃</div>
          <div style="padding:8px;font-size:11px;color:var(--text-secondary);">城市夜景</div>
        </div>
      </div>
    </div>

    <div style="margin-top:24px;padding:16px;background:var(--surface);border-radius:8px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;">🖱️ 交互方式</div>
      <div style="display:flex;gap:20px;font-size:12px;color:var(--muted);flex-wrap:wrap;">
        <div>点击任意图片 → 灯箱</div>
        <div>图片保持原始比例（不被裁切）</div>
        <div>滚动加载更多</div>
      </div>
    </div>
  </div>
</div>

<div style="margin-top:16px;padding:12px;background:rgba(0,184,148,0.1);border:1px solid rgba(0,184,148,0.2);border-radius:8px;">
  <strong>特点：</strong> 视觉最丰富，图片不用裁切。适合展示摄影作品。但瀑布流实现复杂（需要 JS 计算布局），移动端需小心处理。
</div>
