services:
  postgres:
    image: postgres:16-alpine
    container_name: tano_blog_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5431:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tano_blog
      POSTGRES_USER: tano
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tano_blog_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tano -d tano_blog"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
    image: ${APP_IMAGE:-tano_blog:local}
    container_name: tano_blog_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_DSN: postgres://tano:${DB_PASSWORD:-tano_blog_pass}@postgres:5432/tano_blog?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_PORT: "8080"
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      CORS_ORIGINS: ""
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      TRUSTED_PROXIES: 127.0.0.1,::1
      GIN_MODE: release
      API_UPSTREAM_URL: http://localhost:8080
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
