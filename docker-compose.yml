services:
  postgres:
    image: postgres:16-alpine
    container_name: tano_blog_db
    restart: unless-stopped
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tano_blog
      POSTGRES_USER: tano
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tano_blog_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tano -d tano_blog"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: tano26/tano_blog:latest
    container_name: tano_blog_app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DB_DSN: postgres://tano:${DB_PASSWORD:-tano_blog_pass}@postgres:5432/tano_blog?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SERVER_PORT: "8080"
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      CORS_ORIGINS: ""
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      GIN_MODE: release
      API_UPSTREAM_URL: http://localhost:8080
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - app-uploads:/data/uploads
      - app-backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  app-uploads:
  app-backups:
