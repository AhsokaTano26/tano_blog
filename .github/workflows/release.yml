name: Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'VERSION'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          FEATS=$(git log "$LATEST_TAG..HEAD" --oneline --grep="^feat" 2>/dev/null | wc -l)
          FIXES=$(git log "$LATEST_TAG..HEAD" --oneline --grep="^fix" 2>/dev/null | wc -l)

          BASE="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if [ "$FEATS" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$FIXES" -gt 0 ]; then
            PATCH=$((PATCH + 1))
          else
            FILE_VER="$(cat VERSION 2>/dev/null || echo '')"
            if [ "$FILE_VER" != "$BASE" ]; then
              echo "VERSION=$FILE_VER" >> "$GITHUB_OUTPUT"
              echo "version=$FILE_VER" >> "$GITHUB_OUTPUT"
              echo "Using version from VERSION file: $FILE_VER"
            else
              echo "VERSION=$BASE" >> "$GITHUB_OUTPUT"
              echo "version=$BASE" >> "$GITHUB_OUTPUT"
              echo "No changes since $LATEST_TAG, skipping release"
            fi
          fi

          # Only set VERSION from semver calc when feat or fix found
          if [ "$FEATS" -gt 0 ] || [ "$FIXES" -gt 0 ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "New version: v$NEW_VERSION"
          fi

      - name: Check if tag already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Git tag
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="v${{ steps.version.outputs.VERSION }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Update VERSION file
        if: steps.check.outputs.exists == 'false'
        run: |
          echo "${{ steps.version.outputs.VERSION }}" > VERSION
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=v${{ steps.version.outputs.VERSION }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            tano26/tano_blog:v${{ steps.version.outputs.VERSION }}
            tano26/tano_blog:latest
