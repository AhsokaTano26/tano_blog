name: Release

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'scripts/**', 'Dockerfile', 'docker-entrypoint.sh', 'docker-compose.yml', 'VERSION', '.github/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blog_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://postgres:test-only-password@localhost:5432/blog_test?sslmode=disable
      REQUIRE_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify backend with PostgreSQL
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/server
          go build -o browserfixture ./cmd/browserfixture
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frontend
        working-directory: frontend
        env:
          API_UPSTREAM_URL: http://127.0.0.1:18080
          NEXT_PUBLIC_API_URL: ''
        run: |
          npm ci
          npm run test:guard
          npm test
          npm run lint
          npm run build
          npx tsc --noEmit
      - name: Verify release planning and process shutdown
        working-directory: frontend
        run: npm test -- -- ../scripts/tests/*.test.mjs
      - name: Install real-browser test runtimes
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit
      - name: Verify production UI in Chromium and WebKit
        working-directory: frontend
        timeout-minutes: 6
        run: npm run test:browser
      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: frontend/test-results/browser/
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # All publish entry points share a lock, including manual reruns.
    concurrency:
      group: blog-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan release of the verified commit
        id: plan
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/release-plan.mjs
      - name: Reserve version on the verified commit
        if: steps.plan.outputs.release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          VERIFIED_SHA: ${{ steps.plan.outputs.sha }}
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          TAG="v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$VERIFIED_SHA"
          else
            git tag -a "$TAG" "$VERIFIED_SHA" -m "Release $TAG"
          fi
          git push origin "refs/tags/$TAG"
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.release == 'true'
      - uses: docker/login-action@v3
        if: steps.plan.outputs.release == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Choose image tags
        if: steps.plan.outputs.release == 'true'
        id: images
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          PUBLISH_LATEST: ${{ steps.plan.outputs.publishLatest }}
        run: |
          echo 'tags<<TAGS' >> "$GITHUB_OUTPUT"
          echo "tano26/tano_blog:v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_LATEST" = 'true' ]; then
            echo 'tano26/tano_blog:latest' >> "$GITHUB_OUTPUT"
          fi
          echo 'TAGS' >> "$GITHUB_OUTPUT"
      # Always rebuild/retry artifacts for a tag on this SHA. An existing tag
      # does not imply an image or GitHub Release was successfully published.
      - name: Build and push
        if: steps.plan.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=v${{ steps.plan.outputs.version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.images.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Ensure GitHub Release exists
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previousTag }}
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            exit 0
          fi
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --oneline --no-merges "$PREVIOUS_TAG..HEAD" > /tmp/release-notes.md
          else
            git log --oneline --no-merges -20 > /tmp/release-notes.md
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/release-notes.md
