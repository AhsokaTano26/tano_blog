name: Release

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'VERSION'
      - '.github/**'

# 同一分支上的发布任务顺序执行，避免两个工作流同时创建相同版本或标签。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          FEATS=$(git log "$LATEST_TAG..HEAD" --oneline --grep="^feat" 2>/dev/null | wc -l)
          FIXES=$(git log "$LATEST_TAG..HEAD" --oneline --grep="^fix" 2>/dev/null | wc -l)

          # Detect breaking changes: "BREAKING CHANGE:" footer or "type!:" syntax
          BREAKING=$(git log "$LATEST_TAG..HEAD" --oneline --grep="BREAKING CHANGE" 2>/dev/null | wc -l)
          if [ "$BREAKING" -eq 0 ]; then
            BREAKING=$(git log "$LATEST_TAG..HEAD" --oneline --grep="!:" 2>/dev/null | wc -l)
          fi

          BASE="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if [ "$BREAKING" -gt 0 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$FEATS" -gt 0 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$FIXES" -gt 0 ]; then
            PATCH=$((PATCH + 1))
          else
            FILE_VER="$(cat VERSION 2>/dev/null || echo '')"
            if [ "$FILE_VER" != "$BASE" ]; then
              echo "VERSION=$FILE_VER" >> "$GITHUB_OUTPUT"
              echo "version=$FILE_VER" >> "$GITHUB_OUTPUT"
              echo "Using version from VERSION file: $FILE_VER"
            else
              echo "VERSION=$BASE" >> "$GITHUB_OUTPUT"
              echo "version=$BASE" >> "$GITHUB_OUTPUT"
              echo "No changes since $LATEST_TAG, skipping release"
            fi
          fi

          # Only set VERSION from semver calc when breaking, feat or fix found
          if [ "$BREAKING" -gt 0 ] || [ "$FEATS" -gt 0 ] || [ "$FIXES" -gt 0 ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "New version: v$NEW_VERSION"
          fi

      - name: Check if tag already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update VERSION file
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # 测试期间 main 可能被新的提交推进；先以远程分支为基准，
          # 避免版本提交因非快进而直接失败。
          git fetch origin main
          git rebase origin/main
          echo "${{ steps.version.outputs.VERSION }}" > VERSION
          git add VERSION
          # 仅在 VERSION 确实变化时创建提交。
          if git diff --cached --quiet HEAD -- VERSION; then
            echo "VERSION unchanged, skipping commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "main 在推送期间更新，正在进行第 ${attempt} 次 rebase 重试"
              git fetch origin main
              git rebase origin/main
            done
            echo "无法在三次尝试内推送 VERSION 提交"
            exit 1
          fi

      - name: Create Git tag
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="v${{ steps.version.outputs.VERSION }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin tag "$VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=v${{ steps.version.outputs.VERSION }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            tano26/tano_blog:v${{ steps.version.outputs.VERSION }}
            tano26/tano_blog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.VERSION }}"
          PREV="${{ steps.version.outputs.LATEST_TAG }}"
          if [ "$PREV" = "v0.0.0" ]; then
            NOTES="$(git log --oneline --no-merges -20)"
          else
            NOTES="$(git log "$PREV..HEAD" --oneline --no-merges)"
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"
